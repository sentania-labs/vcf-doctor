# Placement: GitHub-hosted. Public repo (free), nothing here touches the lab,
# and the smoke test needs a real Docker daemon, which the lab pool never has.
#
# Gates, in order: checks (lint, tests, frontend build) -> scan (dependency
# audit, secret scan, repo misconfig/lockfile scan) -> image (build once, image
# scan, smoke test). Publication and release behavior is documented in
# docs/DEPLOYMENT.md. The OCI tarball preserves the scanned and smoke-tested
# digest across jobs. Completed-release retries reuse the recorded digest
# instead, preserving the original signed artifact even after a rebuild.
# Every scanner is invoked through `make`, so a developer runs exactly what CI
# runs.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; the image job widens its own scope below.
permissions:
  contents: read

# bash with -eo pipefail for every run step, so a failing left side of a pipe
# fails the step instead of feeding an empty string to the next command.
defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TRIVY_VERSION: v0.74.0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate annotated release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
          MAINLINE_REF: origin/main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash .github/scripts/check-release-version.sh
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make lint
      - run: make test
      - run: make build-frontend

  # Dependency vulnerabilities (pip-audit, npm audit), committed secrets
  # (gitleaks over full history) and repo misconfiguration + lockfile CVEs
  # (trivy fs). Blocks on: any known vulnerability in the backend environment,
  # HIGH+ in frontend runtime deps, any secret, HIGH/CRITICAL fixable CVE or
  # misconfiguration in the repo.
  scan:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - run: make setup
      - run: make scan

  # Pull requests only: refuses newly introduced dependencies with known HIGH+
  # advisories or disallowed licenses before they reach main.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Builds and validates the image for every PR and push. Runs PR-controlled
  # code (Docker build, make scan-image, the smoke-test shell) without any
  # elevated token: id-token/packages/attestations write live only in the
  # push-only `publish` job below, so a same-repo PR can never mint an OIDC
  # certificate through this workflow.
  #
  # The image is built exactly once, here, as an OCI tarball. The same tarball
  # is loaded into the local daemon for the scan and the smoke test, then
  # uploaded as a run artifact for `publish` to push unchanged.
  image:
    needs: [checks, scan]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      # The identity is decided before the only image build, so the running
      # product reports the pushed release tag or an unambiguous CI identity.
      - name: Compute build identity
        id: identity
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="$GITHUB_REF_NAME" ;;
            refs/heads/main) VERSION="main-${GITHUB_SHA::7}" ;;
            *) VERSION="dev-${GITHUB_SHA::7}" ;;
          esac
          echo "build identity: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # skopeo moves the OCI tarball into the daemon (docker load cannot read an
      # index that carries attestation manifests). GitHub-hosted runner: sudo is fine.
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      # The only build in this workflow. The OCI index carries a max-mode SLSA
      # provenance attestation and an SPDX SBOM, both attached to the digest and
      # readable after publish with `docker buildx imagetools inspect`.
      - name: Build once (OCI tarball with provenance and SBOM)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          tags: vcf-doctor:ci
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.identity.outputs.version }}
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.identity.outputs.built_at }}

      # The digest under test is the OCI index digest recorded in the tarball.
      # It must match what buildx reported; the publish job compares against it.
      - name: Record tested digest and load for scan and smoke
        id: digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          DIGEST="$(tar -xOf "$RUNNER_TEMP/image.tar" index.json | jq -r '.manifests[0].digest')"
          case "$DIGEST" in sha256:*) ;; *) echo "no index digest in tarball: '$DIGEST'"; exit 1 ;; esac
          if [ "$DIGEST" != "$BUILD_DIGEST" ]; then
            echo "tarball index digest $DIGEST differs from buildx digest $BUILD_DIGEST"; exit 1
          fi
          echo "tested digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          skopeo copy "oci-archive:$RUNNER_TEMP/image.tar" docker-daemon:vcf-doctor:ci

      # Blocks on: HIGH/CRITICAL CVEs with a fix available in the image
      # (OS packages, bundled Python and npm packages). Unfixed CVEs are
      # reported but do not gate; accepted CVEs live in .trivyignore.
      - name: Scan image
        run: make scan-image IMAGE=vcf-doctor:ci

      # VCF_DOCTOR_TEST_FIXTURES is the test-only hook that lets a connection
      # of kind "fixture" (bundled snapshot data) stand in for a vCenter.
      #
      # The stack is PostgreSQL plus the image under test, wired the way
      # docker-compose.yml wires them: the database password is a file mounted
      # read only, never an environment variable, and the schema is applied by a
      # one-shot run of the same image before the console starts.
      - name: Smoke test (fixture collector, no vCenter)
        env:
          SMOKE_DATABASE_URL: postgresql://vcf_doctor@smoke-db:5432/vcf_doctor
        run: |
          docker network create smoke-net
          # One copy of the password per reader, each owned by that reader and
          # readable by nobody else: postgres runs as uid 999 and the console as
          # uid 10001, so a single shared file would have to be world readable.
          mkdir -p "$RUNNER_TEMP/secrets"
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$RUNNER_TEMP/secrets/db-password"
          cp "$RUNNER_TEMP/secrets/db-password" "$RUNNER_TEMP/secrets/postgres-password"
          sudo chown 10001:10001 "$RUNNER_TEMP/secrets/db-password"
          sudo chown 999:999 "$RUNNER_TEMP/secrets/postgres-password"
          sudo chmod 0400 "$RUNNER_TEMP/secrets"/*-password
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_USER=vcf_doctor -e POSTGRES_DB=vcf_doctor \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" \
            -v smoke-db-data:/var/lib/postgresql/data \
            postgres:16
          for i in $(seq 1 60); do
            docker exec smoke-db pg_isready -U vcf_doctor -d vcf_doctor -q && break
            if [ "$i" = 60 ]; then echo "postgres never became ready"; docker logs smoke-db; exit 1; fi
            sleep 1
          done
          # The one-shot migration step, exactly as compose runs it.
          docker run --rm --network smoke-net \
            -e VCF_DOCTOR_DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e VCF_DOCTOR_DB_PASSWORD_FILE=/run/secrets/db-password \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" \
            vcf-doctor:ci python3 -m app.migrate upgrade | tee migrate.log
          grep -q '0001_initial' migrate.log
          # Trust the whole docker bridge so the forwarded-header checks below see a trusted peer.
          # Two workers: the single-writer ceiling that forced one replica is gone.
          docker run -d --name smoke --network smoke-net -p 8000:8000 \
            -e VCF_DOCTOR_TEST_FIXTURES=1 -e VCF_DOCTOR_ADMIN_PASSWORD=smoke-test-pass \
            -e VCF_DOCTOR_TRUSTED_PROXIES=172.16.0.0/12 \
            -e VCF_DOCTOR_DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e VCF_DOCTOR_DB_PASSWORD_FILE=/run/secrets/db-password \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" \
            -v smoke-data:/data \
            vcf-doctor:ci \
            uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers --workers 2
          for i in $(seq 1 60); do
            curl -fsS localhost:8000/api/health/ready && break
            if [ "$i" = 60 ]; then echo "container never became ready"; docker logs smoke; exit 1; fi
            sleep 1
          done
          curl -fsS localhost:8000/api/health/ready | grep -q '"status":"ok"'
          curl -fsS localhost:8000/api/health/live | grep -q '"status":"ok"'
          # The database is reachable and migrated, and one worker holds the
          # scheduler lock, which every worker reports.
          curl -fsS localhost:8000/api/health/ready | grep -q '"database":true'
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/api/health/ready | grep -q '"scheduler":true'; then break; fi
            if [ "$i" = 30 ]; then echo "scheduler never became active"; docker logs smoke; exit 1; fi
            sleep 1
          done
          # The console reads its password from a file only it can read.
          test "$(docker exec smoke stat -c '%a %u' /run/secrets/db-password)" = "400 10001"
          test "$(docker exec smoke sh -c 'cat /run/secrets/postgres-password 2>/dev/null' | wc -c)" = 0
          # One uvicorn master with two worker processes under it. Uvicorn spawns
          # workers through multiprocessing, so a worker's command line is the
          # spawn helper rather than "uvicorn"; if that ever changes this check
          # fails loudly rather than passing on a single worker.
          test "$(docker top smoke -o pid,args | grep -c 'app.main:app')" = 1
          test "$(docker top smoke -o pid,args | grep -c -- '--multiprocessing-fork')" = 2
          VERSION='${{ steps.identity.outputs.version }}' SHA="$GITHUB_SHA" BUILT_AT='${{ steps.identity.outputs.built_at }}' \
            python3 -c 'import json,os,urllib.request; v=json.load(urllib.request.urlopen("http://localhost:8000/api/version")); assert v["version"] == os.environ["VERSION"]; assert v["sha"] == os.environ["SHA"]; assert v["built_at"] == os.environ["BUILT_AT"]'
          VERSION='${{ steps.identity.outputs.version }}' \
            python3 -c 'import json,os,urllib.request; h=json.load(urllib.request.urlopen("http://localhost:8000/api/health")); assert h["version"] == os.environ["VERSION"]'
          curl -fsS localhost:8000/ | grep -q '<title>VCF Doctor</title>'
          # Unauthenticated API access is refused; traversal cannot reach the
          # encryption key file, which is all the volume still holds.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/overview)" = 401
          curl -s --path-as-is localhost:8000/../data/vcf-doctor.key | grep -q '<title>VCF Doctor</title>'
          # Log in with the seeded password. A fresh install has no connections.
          curl -fsS -c cj -H 'content-type: application/json' -d '{"password":"smoke-test-pass"}' localhost:8000/api/auth/login
          test "$(curl -fsS -b cj localhost:8000/api/connections)" = '[]'
          # Add a fixture connection, scan it, then check the fixture inventory (51 resources) is in the image.
          cid=$(curl -fsS -b cj -H 'content-type: application/json' \
            -d '{"name":"Smoke","host":"fixture","username":"smoke","password":"","kind":"fixture"}' \
            localhost:8000/api/connections | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -b cj -H 'content-type: application/json' -d "{\"connection_id\":\"$cid\"}" localhost:8000/api/scan | grep -q '"status":"ok"'
          curl -fsS -b cj localhost:8000/api/overview | python3 -c 'import json,sys; o=json.load(sys.stdin); assert o["resource_total"] == 51, o["resource_total"]'
          # Security headers on the UI and the API; HSTS only when a trusted proxy says https.
          # (GET with dumped headers: the app does not answer HEAD.)
          hdr() { curl -fsS -o /dev/null -D - "$@"; }
          hdr localhost:8000/ | grep -qi '^content-security-policy: '
          hdr localhost:8000/api/health | grep -qi '^cache-control: no-store'
          if hdr localhost:8000/ | grep -qi '^strict-transport-security'; then echo 'HSTS sent on plain http'; exit 1; fi
          hdr -H 'X-Forwarded-Proto: https' localhost:8000/ | grep -qi '^strict-transport-security: max-age=31536000'
          # Login lockout is per forwarded client: five wrong passwords lock one address, not the next.
          for i in 1 2 3 4 5; do curl -s -o /dev/null -H 'content-type: application/json' -H 'X-Forwarded-For: 203.0.113.5' -d '{"password":"nope-nope"}' localhost:8000/api/auth/login; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H 'X-Forwarded-For: 203.0.113.5' -d '{"password":"smoke-test-pass"}' localhost:8000/api/auth/login)" = 429
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H 'X-Forwarded-For: 203.0.113.6' -d '{"password":"smoke-test-pass"}' localhost:8000/api/auth/login)" = 200
          # Runs as a non-root user.
          test "$(docker exec smoke id -u)" = 10001
          # A restart keeps its history: the connection, its snapshot and the
          # 51 fixture resources are all still there afterwards.
          docker restart smoke
          for i in $(seq 1 60); do
            curl -fsS localhost:8000/api/health/ready >/dev/null && break
            if [ "$i" = 60 ]; then echo "container did not come back"; docker logs smoke; exit 1; fi
            sleep 1
          done
          curl -fsS -c cj2 -H 'content-type: application/json' -d '{"password":"smoke-test-pass"}' localhost:8000/api/auth/login
          curl -fsS -b cj2 localhost:8000/api/connections | grep -q '"Smoke"'
          curl -fsS -b cj2 localhost:8000/api/overview | python3 -c 'import json,sys; o=json.load(sys.stdin); assert o["resource_total"] == 51, o["resource_total"]'
          test "$(docker top smoke -o pid,args | grep -c -- '--multiprocessing-fork')" = 2
          # Liveness and readiness disagree while the database is down, which is
          # the whole point: nothing restarts the container, and nothing routes
          # traffic to it either.
          docker stop smoke-db
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/health/live)" = 200
          # The older name still answers liveness, so a manifest that has not
          # been repointed yet does not restart-loop through the outage.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/health/ready)" = 503
          curl -s localhost:8000/api/health/ready | grep -q '"database":false'
          health_checks_before=$(docker inspect --format '{{len .State.Health.Log}}' smoke)
          health_check_before=$(docker inspect --format '{{range .State.Health.Log}}{{.End}}{{"\n"}}{{end}}' smoke | tail -n 1)
          health=
          health_check_exit=
          for i in $(seq 1 65); do
            health=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            if [ "$health" = unhealthy ]; then echo "container went unhealthy while the database was down"; exit 1; fi
            health_checks=$(docker inspect --format '{{len .State.Health.Log}}' smoke)
            health_check=$(docker inspect --format '{{range .State.Health.Log}}{{.End}}{{"\n"}}{{end}}' smoke | tail -n 1)
            if [ "$health_checks" -gt "$health_checks_before" ] || [ "$health_check" != "$health_check_before" ]; then
              health_observation=$(docker inspect --format '{{.State.Health.Status}}{{range .State.Health.Log}} {{.ExitCode}}{{end}}' smoke)
              health=${health_observation%% *}
              health_check_exit=${health_observation##* }
              break
            fi
            sleep 1
          done
          test "$health_check_exit" = 0
          test "$health" = healthy
          docker start smoke-db
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/health/ready)" = 200 ] && break
            if [ "$i" = 60 ]; then echo "never became ready again"; docker logs smoke; exit 1; fi
            sleep 1
          done

      - name: Container logs
        if: always()
        run: |
          docker logs smoke || true
          docker logs smoke-db || true
          docker rm -f smoke smoke-db || true
          docker network rm smoke-net || true
          docker volume rm -f smoke-db-data smoke-data || true

      # Uploaded only after scan and smoke passed, so the artifact is the
      # validated image and nothing else. Artifacts are scoped to the run, so a
      # plain name lets "re-run failed jobs" on publish find the image job's
      # tarball; overwrite covers a full re-run. Three days covers a publish
      # re-run the next morning.
      - name: Upload tested image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-oci
          path: ${{ runner.temp }}/image.tar
          retention-days: 3
          overwrite: true
          compression-level: 0 # layers are already gzip; recompressing only burns time
          if-no-files-found: error

  # Main and release-tag pushes only. Split out of `image` so the OIDC token and
  # write scopes below are never granted to a PR-triggered run. Nothing is
  # built here: new publications use the tested tarball; completed releases
  # retain their recorded artifact.
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # release from pushed tag
      packages: write # push to GHCR
      id-token: write # keyless cosign (Fulcio/Rekor) needs the OIDC token
      actions: read # download the tested image artifact from this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Download tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-oci
          path: ${{ runner.temp }}

      # Gate 1 of 2: the tarball we are about to push is the one `image` tested.
      - name: Verify tarball digest matches the tested digest
        id: tested
        env:
          TESTED: ${{ needs.image.outputs.digest }}
        run: |
          test -n "$TESTED" || { echo "image job reported no digest"; exit 1; }
          LOCAL="$(tar -xOf "$RUNNER_TEMP/image.tar" index.json | jq -r '.manifests[0].digest')"
          if [ "$LOCAL" != "$TESTED" ]; then
            echo "artifact digest $LOCAL differs from tested digest $TESTED"; exit 1
          fi
          echo "tested digest: $TESTED"
          echo "digest=$TESTED" >> "$GITHUB_OUTPUT"

      # One login serves skopeo, buildx imagetools and cosign: all three read
      # the Docker credential store.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `--all` copies the whole index (image manifest plus the provenance and
      # SBOM attestation manifests) byte for byte, so the digest survives.
      - name: Publish tested tarball or reuse completed release
        id: published
        env:
          VERSION: ${{ needs.image.outputs.version }}
          TESTED: ${{ steps.tested.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-tested-image.sh

      # Gate 2 of 2: the registry must serve the tested digest, or the recorded
      # digest on a completed-release retry, before publication can proceed.
      - name: Verify published digest equals tested digest
        env:
          TESTED: ${{ steps.published.outputs.digest }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS="$VERSION"
          else
            TAGS="sha-${GITHUB_SHA::7}"
          fi
          for TAG in $TAGS; do
            PUBLISHED="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ "$PUBLISHED" != "$TESTED" ]; then
              echo "$IMAGE:$TAG serves $PUBLISHED, tested digest was $TESTED"; exit 1
            fi
            echo "$IMAGE:$TAG -> $PUBLISHED (matches tested digest)"
          done
          docker buildx imagetools inspect "$IMAGE@$TESTED" | grep -q 'attestation-manifest' || { echo "no attestation manifest on published digest"; exit 1; }

      - name: Install cosign
        if: steps.published.outputs.reused != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity and
      # logged in Rekor. Verify with:
      #   cosign verify ghcr.io/<owner>/vcf-doctor@<digest> \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp '^https://github.com/<owner>/vcf-doctor/'
      - name: Sign published digest
        if: steps.published.outputs.reused != 'true'
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Completed-release retries skip signing and creation after verifying
      # the original artifact against its release record.
      - name: Create GitHub release from pushed tag
        if: startsWith(github.ref, 'refs/tags/') && steps.published.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.published.outputs.digest }}
          V: ${{ needs.image.outputs.version }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          VERSION="$V" MAINLINE_REF=origin/main bash .github/scripts/check-release-version.sh
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --verify-tag --generate-notes --title "$V" \
            --notes "Image: $IMAGE:$V. Digest: $DIGEST (the digest scanned and smoke-tested in this run; cosign keyless signed, SBOM + provenance attached)"

  promote-latest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: ci-promote-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote and verify highest completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/promote-latest.sh
