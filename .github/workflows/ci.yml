# Placement: GitHub-hosted. Public repo (free), nothing here touches the lab,
# and the smoke test needs a real Docker daemon, which the lab pool never has.
# Image scanning is suspended under the hackathon exception until 2026-09-02.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make lint
      - run: make test
      - run: make build-frontend

  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (local load for smoke)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: vcf-doctor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (fixture mode, no vCenter)
        run: |
          docker run -d --name smoke -p 8000:8000 -e VCF_DOCTOR_DEMO_MODE=true vcf-doctor:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/api/health && break
            sleep 1
          done
          curl -fsS localhost:8000/api/health | grep -q '"status":"ok"'
          curl -fsS localhost:8000/ | grep -q '<title>VCF Doctor</title>'
          # Fixture inventory must be in the image (51 resources), not the 10-resource fallback.
          curl -fsS localhost:8000/api/overview | python3 -c 'import json,sys; o=json.load(sys.stdin); assert o["resource_total"] == 51, o["resource_total"]'
          docker logs smoke
          docker rm -f smoke

      - name: Compute tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: tags
        run: |
          VERSION="v0.1.${{ github.run_number }}"
          SHORT="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "list=$IMAGE:$VERSION,$IMAGE:sha-$SHORT,$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha

      - name: Tag release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.tags.outputs.version }}"
          git tag "$V" && git push origin "$V"
          gh release create "$V" --generate-notes --title "$V" \
            --notes "Image: $IMAGE:$V (also sha-${GITHUB_SHA::7}, latest)"
