# Local development convenience only. Deployment is owned by the lab
# deployment repo and Argo CD; see README "Deployment contract".
services:
  vcf-doctor:
    build: .
    ports: ["8000:8000"]
    environment:
      VCF_DOCTOR_DEMO_MODE: "${VCF_DOCTOR_DEMO_MODE:-false}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      - vcf-doctor-data:/data
volumes:
  vcf-doctor-data:
